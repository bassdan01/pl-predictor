<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0a45">
<title>Matchday Predictor</title>
<style>
:root{
  --bg:#efedf4; --card:#ffffff; --ink:#24103a; --mute:#6b5f7e; --line:#ddd7e8;
  --home:#4b1d8f; --draw:#cfc8dc; --away:#d6336c; --win:#0b8f5a; --loss:#d6336c; --draw-chip:#8a7fa0;
  --head:#2a0a45; --head-ink:#f4eefc;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#150a22; --card:#21123a; --ink:#efe8fa; --mute:#a597bd; --line:#35254f;
  --home:#a47bf0; --draw:#4a3b66; --away:#ff6b9a; --win:#3ddc97; --loss:#ff6b9a; --draw-chip:#8a7fa0;
  --head:#0e0618; --head-ink:#efe8fa;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--head);color:var(--head-ink);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 14px}
header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
header p{margin:4px 0 0;font-size:13px;opacity:.75}
.tabs{display:flex;gap:6px;padding:12px 14px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-weight:600;
  padding:10px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--home);border-color:var(--home);color:#fff}
@media (prefers-color-scheme:dark){.tabs button[aria-selected=true]{color:#150a22}}
main{padding:12px 14px 28px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ko{font-size:12px;color:var(--mute);margin-bottom:8px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.t{font-weight:700;line-height:1.15}
.t.r{text-align:right}
.score{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;letter-spacing:.02em;
  background:var(--head);color:var(--head-ink);border-radius:10px;padding:4px 14px;min-width:88px;text-align:center}
.actual{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:12px 0 4px;background:var(--draw)}
.bar i{display:block}
.bar .h{background:var(--home)} .bar .d{background:var(--draw)} .bar .a{background:var(--away)}
.pcts{display:flex;justify-content:space-between;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pcts span:nth-child(2){color:var(--mute);font-weight:500}
.xg{font-size:13px;color:var(--mute);margin-top:6px}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--home);list-style:none}
summary::-webkit-details-marker{display:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:14px}
.cols h3{margin:0 0 4px;font-size:13px;color:var(--mute);font-weight:600}
.chips{display:flex;gap:4px;margin-bottom:6px}
.chip{width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:800;color:#fff;display:grid;place-items:center}
.chip.W{background:var(--win)} .chip.D{background:var(--draw-chip)} .chip.L{background:var(--loss)}
.small{font-size:12px;color:var(--mute);margin-bottom:6px}
.sc{display:flex;justify-content:space-between;gap:6px;padding:2px 0;font-variant-numeric:tabular-nums}
.doubt{color:var(--loss)}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .n{font-weight:800;color:var(--mute);font-variant-numeric:tabular-nums}
.rank .who b{display:block}
.rank .who span{font-size:12px;color:var(--mute)}
.rank .pc{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.rank .meter{height:4px;border-radius:2px;background:var(--home);margin-top:5px}
.msg{padding:24px 6px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--home)}
.stat span{font-size:12px;color:var(--mute);line-height:1.25;display:block}
.stat em{font-style:normal;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gwh{font-weight:800;margin:16px 2px 8px}
.verdict{display:flex;gap:6px;margin-top:8px;font-size:12px;font-weight:700}
.verdict span{padding:3px 8px;border-radius:999px;background:var(--draw);color:var(--ink)}
.verdict .ok{background:var(--win);color:#fff}
.verdict .bad{background:var(--loss);color:#fff}
@media (prefers-color-scheme:dark){.verdict .ok,.verdict .bad{color:#150a22}}
.hit{font-weight:800;color:var(--win)}
.miss{color:var(--mute)}
footer{padding:0 18px 24px;text-align:center;font-size:12px;color:var(--mute)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--home);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1 id="gw">Matchday Predictor</h1>
  <p id="sub">Loading…</p>
</header>
<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-v="fix">Fixtures</button>
  <button role="tab" aria-selected="false" data-v="rank">Most likely to win</button>
  <button role="tab" aria-selected="false" data-v="res">Results</button>
</div>
<main id="app"><div class="msg">Loading predictions…</div></main>
<footer id="foot"></footer>
<script>
const app = document.getElementById("app");
let data = null, view = "fix";

function h(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const pct = p => Math.round(p * 100) + "%";
const when = (iso, opts) => iso ? new Date(iso).toLocaleString([], opts) : "";

function formBlock(name, f){
  const box = h("div");
  box.append(h("h3", null, name));
  const chips = h("div", "chips");
  for (const c of f.form) chips.append(h("span", "chip " + c, c));
  box.append(chips);
  const line = f.xg_for != null
    ? `Last ${f.form.length}: ${f.goals_for} scored, ${f.goals_against} conceded. xG ${f.xg_for} for, ${f.xg_against} against per game.`
    : `Last ${f.form.length}: ${f.goals_for} scored, ${f.goals_against} conceded.`;
  box.append(h("div", "small", line));
  return box;
}
function scorerBlock(list){
  const box = h("div");
  if (!list.length) box.append(h("div", "small", "No data yet."));
  for (const p of list){
    const row = h("div", "sc");
    row.append(h("span", p.doubt ? "doubt" : null, p.name + (p.doubt ? " (doubt)" : "")), h("b", null, pct(p.prob)));
    box.append(row);
  }
  return box;
}

function fixtureCard(f){
  const c = h("div", "card");
  c.append(h("div", "ko", when(f.kickoff, {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"})));

  const m = h("div", "match");
  m.append(h("div", "t", f.home), h("div", "score", `${f.pred_home} – ${f.pred_away}`), h("div", "t r", f.away));
  c.append(m);
  if (f.actual) c.append(h("div", "actual", `${f.finished ? "Full time" : "Live"}: ${f.actual[0]} – ${f.actual[1]}`));

  const bar = h("div", "bar");
  for (const [k, v] of [["h", f.p_home], ["d", f.p_draw], ["a", f.p_away]]){
    const s = h("i", k); s.style.width = (v * 100) + "%"; bar.append(s);
  }
  c.append(bar);
  const pc = h("div", "pcts");
  pc.append(h("span", null, pct(f.p_home)), h("span", null, "Draw " + pct(f.p_draw)), h("span", null, pct(f.p_away)));
  c.append(pc);
  c.append(h("div", "xg", `Expected goals ${f.xg_home} – ${f.xg_away}`));

  const d = h("details");
  d.append(h("summary", null, "Form and likely scorers"));
  const form = h("div", "cols");
  form.append(formBlock(f.home, f.form_home), formBlock(f.away, f.form_away));
  const sc = h("div", "cols");
  sc.append(scorerBlock(f.scorers_home), scorerBlock(f.scorers_away));
  d.append(form, h("div", "small", "Chance to score, from recent xG:"), sc);
  c.append(d);
  return c;
}

function rankView(){
  const card = h("div", "card");
  data.ranking.forEach((r, i) => {
    const row = h("div", "rank");
    row.append(h("div", "n", String(i + 1)));
    const who = h("div", "who");
    who.append(h("b", null, r.team), h("span", null, `${r.venue === "H" ? "vs" : "at"} ${r.opp}`));
    const meter = h("div", "meter"); meter.style.width = (r.win * 100) + "%";
    who.append(meter);
    row.append(who, h("div", "pc", pct(r.win)));
    card.append(row);
  });
  return card;
}

function listScorers(list){
  return list.length ? list.map(s => s.name + (s.n > 1 ? " ×" + s.n : "")).join(", ") : "none";
}
function predList(list){
  const box = h("div");
  list.forEach((s, i) => {
    if (i) box.append(document.createTextNode(", "));
    box.append(h("span", s.hit ? "hit" : "miss", s.name));
  });
  return box;
}
function ratio(a, b){ return b ? Math.round(a / b * 100) + "%" : "–"; }

function resultsView(){
  const wrap = h("div");
  const r = data.results;
  if (!r || !r.summary.matches){
    wrap.append(h("div", "msg", "Results appear here once matches finish. Predictions are saved before kick-off and checked afterwards, starting with the gameweek now showing."));
    return wrap;
  }
  const s = r.summary;
  const stats = h("div", "stats");
  for (const [big, label, sub] of [
    [ratio(s.result_right, s.matches), "Right result", `${s.result_right} of ${s.matches}`],
    [ratio(s.exact, s.matches), "Exact score", `${s.exact} of ${s.matches}`],
    [ratio(s.scorers_hit, s.scorers_named), "Named scorers who scored", `${s.scorers_hit} of ${s.scorers_named}`],
  ]){
    const c = h("div", "stat");
    c.append(h("b", null, big), h("span", null, label), h("em", null, sub));
    stats.append(c);
  }
  wrap.append(stats);

  let lastGw = null;
  for (const m of r.matches){
    if (m.gw !== lastGw){ wrap.append(h("div", "gwh", "Gameweek " + m.gw)); lastGw = m.gw; }
    const c = h("div", "card");
    c.append(h("div", "ko", when(m.kickoff, {weekday:"short", day:"numeric", month:"short"})));
    const row = h("div", "match");
    row.append(h("div", "t", m.home), h("div", "score", `${m.actual[0]} – ${m.actual[1]}`), h("div", "t r", m.away));
    c.append(row);
    c.append(h("div", "actual", `Predicted ${m.pred[0]} – ${m.pred[1]}`));
    const v = h("div", "verdict");
    v.append(h("span", m.result_ok ? "ok" : "bad", m.result_ok ? "Result right" : "Result missed"));
    if (m.exact) v.append(h("span", "ok", "Exact score"));
    c.append(v);
    const d = h("details");
    d.append(h("summary", null, "Scorers"));
    const cols = h("div", "cols");
    for (const [name, scored, pred] of [[m.home, m.scored_home, m.pred_home], [m.away, m.scored_away, m.pred_away]]){
      const b = h("div");
      b.append(h("h3", null, name), h("div", "small", "Scored: " + listScorers(scored)), h("div", "small", "Predicted:"), predList(pred));
      cols.append(b);
    }
    d.append(cols);
    c.append(d);
    wrap.append(c);
  }
  return wrap;
}

function render(){
  app.replaceChildren();
  if (!data){ return; }
  if (view === "fix"){
    if (!data.fixtures.length) app.append(h("div", "msg", "No fixtures in this gameweek."));
    for (const f of data.fixtures) app.append(fixtureCard(f));
  } else if (view === "rank"){
    app.append(rankView());
  } else {
    app.append(resultsView());
  }
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  view = b.dataset.v;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  render();
}));

fetch("data.json?" + Date.now())
  .then(r => { if (!r.ok) throw new Error("missing"); return r.json(); })
  .then(d => {
    data = d;
    document.getElementById("gw").textContent = d.gameweek_name;
    const dl = d.deadline ? "Deadline " + when(d.deadline, {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "";
    document.getElementById("sub").textContent = dl;
    document.getElementById("foot").textContent =
      "Updated " + when(d.generated, {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) +
      (d.uses_xg ? " · form uses xG and goals" : " · form uses goals only");
    render();
  })
  .catch(() => {
    app.replaceChildren(h("div", "msg", "No predictions yet. In GitHub, open the Actions tab, run “Update predictions”, then reload this page."));
    document.getElementById("sub").textContent = "";
  });
</script>
</body>
</html>
